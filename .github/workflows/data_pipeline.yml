name: Daily Market Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"

jobs:
  collect-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉取原始数据
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python src/download_jpm_vix.py

      - name: 清洗并对齐数据
        run: python src/preprocess_data.py

      - name: 构造特征
        run: python src/build_features.py

      - name: 验证数据集
        run: python src/validate_feature_dataset.py

      - name: 上传处理后的数据
        uses: actions/upload-artifact@v4
        with:
          name: processed-market-data
          path: data/processed/